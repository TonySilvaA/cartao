<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>Carbox - Cartão Digital</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f0f0f0;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background: #111;
      padding: 20px;
    }

    .logo {
      max-width: 180px;
      margin: 10px auto;
    }

    h1 {
      margin: 5px 0;
    }

    .tagline {
      color: #ccc;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .buttons a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px auto;
      padding: 15px;
      max-width: 300px;
      background-color: #333;
      color: #fff;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .buttons a:hover {
      background-color: #444;
    }

    .buttons a img {
      width: 20px;
      height: 20px;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo-carbox.jpeg" class="logo" alt="Logo Carbox">

    <h1>Carbox</h1>

    <p class="tagline">
      Cuidando do seu, como se fosse nosso!
    </p>
  </header>

  <div class="buttons">

    <a href="https://meucomercio.com.br/carbox" target="_blank">
      📦 Site Produtos Carbox
    </a>

    <a href="https://wa.me/5538998590618" target="_blank">
      <img 
        src="https://cdn-icons-png.flaticon.com/512/733/733585.png" 
        alt="WhatsApp"
      >
      WhatsApp Carbox
    </a>

    <a href="https://www.instagram.com/carbox_jba" target="_blank">
      <img 
        src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" 
        alt="Instagram"
      >
      Instagram Carbox
    </a>

    <a href="https://share.google/blztNz1TjJTGpXjMW" target="_blank">
      📍 Localização Carbox
    </a>

  </div>

</body>
</html>
